name: Validar PostgreSQL y aislamiento

on:
  pull_request:
    paths:
      - "source/**"
      - ".github/workflows/validate-database.yml"
  push:
    branches:
      - main
    paths:
      - "source/**"
      - ".github/workflows/validate-database.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read

jobs:
  validate-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atelier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/atelier_test
      NODE_ENV: test
      ALLOW_DEV_ADMIN_AUTH: "true"
      DEV_ADMIN_TOKEN: test-admin-token-with-at-least-thirty-two-characters
      DEV_ADMIN_USER_ID: 00000000-0000-4000-8000-000000000001
      DEV_ADMIN_EMAIL: admin@atelier.test
      DEV_ADMIN_DISPLAY_NAME: Administración de prueba
      TWO_FACTOR_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      TWO_FACTOR_RECOVERY_PEPPER: test-recovery-pepper-with-at-least-thirty-two-characters
      AUTH_LOGIN_PEPPER: test-login-pepper-with-at-least-thirty-two-characters
      APP_URL: http://localhost:3000
      SMTP_ENABLED: "false"
      PILOT_CHECKOUT_ENABLED: "true"
      PILOT_SHIPPING_CENTS: "500"
      MIGRATION_STATEMENT_TIMEOUT_MS: "120000"
      MIGRATION_LOCK_TIMEOUT_MS: "10000"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Instalar dependencias de la aplicación fuente
        working-directory: source
        run: npm install --ignore-scripts

      - name: Aplicar migraciones con el ejecutor real
        working-directory: source
        run: npm run migrate

      - name: Comprobar idempotencia e historial de migraciones
        working-directory: source
        run: |
          npm run migrate

          expected="$(find packages/database/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          actual="$(psql -h 127.0.0.1 -U postgres -d atelier_test -tAc 'SELECT count(*) FROM schema_migrations' | tr -d ' ')"

          test "${actual}" = "${expected}"
          psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 \
            -c "SELECT filename, version, checksum_sha256 FROM schema_migrations ORDER BY filename"

      - name: Cargar dos talleres ficticios
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/seeds/0001_two_providers.sql

      - name: Verificar aislamiento por proveedor
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/tests/tenant_isolation.sql

      - name: Verificar autenticación administrativa
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/tests/admin_authentication.sql

      - name: Verificar servicios internos de producción
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/tests/production_internal_services.sql

      - name: Verificar catálogo, medios y revisión editorial
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/tests/catalog_isolation.sql

      - name: Verificar revisiones de artículos publicados
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/tests/published_product_revisions.sql

      - name: Verificar compra durante una revisión publicada
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/tests/checkout_published_revision.sql

      - name: Verificar blog editorial multi-proveedor
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/tests/blog_editorial.sql

      - name: Verificar pedidos y encargos multi-proveedor
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/tests/orders_isolation.sql

      - name: Verificar aprobación de presupuestos por el cliente
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/tests/custom_quote_approval.sql

      - name: Verificar documentos y consentimientos legales
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/tests/legal_consents.sql

      - name: Probar API administrativa y auditoría
        working-directory: source
        run: npm run test:api-integration
