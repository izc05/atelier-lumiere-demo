name: Validar base de datos multi-proveedor

on:
  pull_request:
    paths:
      - "source/packages/database/**"
      - "source/infra/docker/docker-compose.yml"
      - ".github/workflows/validate-database.yml"
  push:
    branches: [main]
    paths:
      - "source/packages/database/**"
      - "source/infra/docker/docker-compose.yml"
      - ".github/workflows/validate-database.yml"

permissions:
  contents: read

jobs:
  tenant-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atelier_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: postgres

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Aplicar esquema principal
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/migrations/0001_core_identity.sql

      - name: Cargar dos talleres ficticios
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/seeds/0001_two_providers.sql

      - name: Verificar aislamiento por proveedor
        run: psql -h 127.0.0.1 -U postgres -d atelier_test -v ON_ERROR_STOP=1 -f source/packages/database/tests/tenant_isolation.sql
