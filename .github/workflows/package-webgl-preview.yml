name: Empaquetar preview WebGL

on:
  pull_request:
    paths:
      - "source/apps/web/public/entrada/webgl/**"
      - "source/apps/web/public/premium-ui.css"
      - "source/apps/web/public/premium-ui.js"
      - "source/apps/web/public/visual-v2-tokens.css"
      - "source/apps/web/public/assets/brand/**"
      - ".github/workflows/package-webgl-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar preview autocontenida
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_DIR="source/apps/web/public"
          test -f "$PUBLIC_DIR/entrada/webgl/index.html"
          test -f "$PUBLIC_DIR/entrada/webgl/scene.js"

          mkdir -p preview/entrada preview/assets
          cp -a "$PUBLIC_DIR/entrada/webgl" preview/entrada/
          cp "$PUBLIC_DIR/premium-ui.css" preview/
          cp "$PUBLIC_DIR/premium-ui.js" preview/
          cp "$PUBLIC_DIR/visual-v2-tokens.css" preview/
          cp -a "$PUBLIC_DIR/assets/brand" preview/assets/
          printf '%s\n' "${GITHUB_SHA}" > preview/PREVIEW_COMMIT.txt

      - name: Guardar artefacto de preview
        uses: actions/upload-artifact@v7
        with:
          name: atelier-webgl-preview-${{ github.sha }}
          path: preview
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
