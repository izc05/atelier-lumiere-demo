name: Exportar fuente temporal del bloque 18

on:
  push:
    branches:
      - block-18-pilot-operations

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama
        uses: actions/checkout@v4

      - name: Empaquetar fuente sin metadatos Git
        run: tar --exclude=.git --exclude='*.env' -czf block-18-source.tar.gz .

      - name: Publicar artefacto temporal
        uses: actions/upload-artifact@v4
        with:
          name: block-18-source
          path: block-18-source.tar.gz
          retention-days: 1
          if-no-files-found: error
