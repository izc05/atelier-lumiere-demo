name: Aplicar bloque 18 validado

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-final-tree:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Descargar rama de trabajo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Comprobar y aplicar parche validado
        run: |
          base64 --decode .github/block18-final.patch.gz.b64 | gzip --decompress > /tmp/block18-final.patch
          echo "0bab1b9f4fbce0cdb3efeee8cad2caee55d59b6217e77d6bf930c96e08f25dd4  /tmp/block18-final.patch" | sha256sum --check --strict
          git apply --check /tmp/block18-final.patch
          git apply --index /tmp/block18-final.patch

      - name: Retirar herramientas temporales
        run: |
          git rm --ignore-unmatch \
            .github/block18-final.patch.gz.b64 \
            .github/workflows/apply-block-18-final.yml \
            .github/workflows/export-block-18-source.yml \
            .github/workflows/export-block-18-pr-source.yml \
            .github/workflows/export-block-18-pr-source-v2.yml

      - name: Publicar árbol definitivo
        run: |
          git config user.name "atelier-lumiere-automation"
          git config user.email "199996336+izc05@users.noreply.github.com"
          git commit -m "Preparar operación segura del piloto"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
