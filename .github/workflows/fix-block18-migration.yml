name: Corregir migración bloque 18

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-migration:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Retirar política ya existente
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('source/packages/database/migrations/0037_production_internal_services.sql')
          text = path.read_text()
          duplicate = "CREATE POLICY login_throttles_auth_service_all ON login_throttles\nFOR ALL USING (app.is_auth_service()) WITH CHECK (app.is_auth_service());\n"
          if duplicate in text:
              path.write_text(text.replace(duplicate, ""))
          PY
      - name: Publicar corrección
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "atelier-lumiere-automation"
          git config user.email "199996336+izc05@users.noreply.github.com"
          git add source/packages/database/migrations/0037_production_internal_services.sql
          git commit -m "Evitar política duplicada en servicios internos"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
