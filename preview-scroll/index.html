<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Vista previa de efectos · Alma de Fiesta</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f0e8; }
    #site-preview { display: block; width: 100%; height: 100dvh; border: 0; background: #f5f0e8; }
    .preview-badge {
      position: fixed;
      z-index: 20;
      top: max(10px, env(safe-area-inset-top));
      right: 10px;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 999px;
      background: rgba(22, 15, 13, .76);
      color: #fff8ed;
      font: 600 11px/1 system-ui, sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase;
      backdrop-filter: blur(9px);
      box-shadow: 0 6px 20px rgba(0,0,0,.16);
      pointer-events: none;
      transition: opacity .35s ease;
    }
    .preview-badge.is-muted { opacity: .28; }
  </style>
</head>
<body>
  <div class="preview-badge" id="preview-badge">Efectos reforzados</div>
  <iframe id="site-preview" title="Vista previa de Alma de Fiesta con efectos de desplazamiento" src="../?preview=motion-v2"></iframe>
  <script src="scroll-effects.js?v=2"></script>
</body>
</html>
