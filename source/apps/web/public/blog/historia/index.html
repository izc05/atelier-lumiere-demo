<!doctype html>
<html lang="es" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#5a0f1f">
  <title>Historia artesana · Atelier Lumière</title>
  <link rel="stylesheet" href="/blog/blog.css">
  <link rel="stylesheet" href="/public-shell.css">
  <script defer src="/public-shell.js"></script>
  <script defer src="/blog/detail.js"></script>
  <link rel="stylesheet" href="/premium-ui.css">
  <script src="/premium-ui.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>
  <div class="shell">
    <header class="topbar" data-public-header>
      <a class="brand" href="/">
        <span class="mark" aria-hidden="true">AL</span>
        <span><strong>Atelier Lumière</strong><small>Historias artesanas</small></span>
      </a>
      <button class="public-menu-toggle" type="button" aria-expanded="false" aria-controls="public-navigation" data-public-menu-toggle>Menú</button>
      <nav class="nav public-navigation" id="public-navigation" aria-label="Navegación principal" data-public-navigation>
        <a class="button ghost" href="/">Inicio</a>
        <a class="button ghost" href="/tienda/">Tienda</a>
        <a class="button ghost" href="/blog/">Historias</a>
        <a class="button ghost" href="/legal/">Legal</a>
        <a class="button primary" href="/carrito/">Carrito</a>
      </nav>
    </header>

    <main id="main-content" tabindex="-1">
      <section id="loading" class="loading" role="status">Abriendo la historia…</section>
      <section id="error" class="error" hidden><div><h2>No se pudo abrir la historia</h2><p id="error-message"></p><a class="button primary" href="/blog/">Volver al blog</a></div></section>
      <article id="article" hidden>
        <header class="article-head">
          <p id="eyebrow" class="eyebrow"></p>
          <h1 id="title"></h1>
          <p id="excerpt" class="lead"></p>
          <div id="tags" class="tags"></div>
        </header>
        <img id="cover" class="article-cover" alt="">
        <div class="article-layout">
          <div>
            <section id="prose" class="prose"></section>
            <section id="gallery" class="gallery"></section>
          </div>
          <aside class="aside">
            <p class="eyebrow">El taller</p>
            <h2 id="provider"></h2>
            <p id="specialty" class="lead"></p>
            <p id="published" class="lead"></p>
            <div id="related-wrap" hidden><p class="eyebrow">Piezas relacionadas</p><div id="related" class="products"></div></div>
          </aside>
        </div>
      </article>
    </main>
  </div>
</body>
</html>
