services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: 3000
      API_INTERNAL_URL: http://api:4000
      ENABLE_ADMIN_UI: ${ENABLE_ADMIN_UI:-false}
      DEV_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:-}
      WEB_ADMIN_ACCESS_KEY: ${WEB_ADMIN_ACCESS_KEY:-}
      WEB_ADMIN_SESSION_TTL_MINUTES: ${WEB_ADMIN_SESSION_TTL_MINUTES:-480}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-false}
      PROVIDER_COOKIE_SECURE: ${PROVIDER_COOKIE_SECURE:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-atelier}:${POSTGRES_PASSWORD:-atelier_dev_change_me}@database:5432/${POSTGRES_DB:-atelier_lumiere}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-5000}
      AUTH_SERVICE_USER_ID: ${AUTH_SERVICE_USER_ID:-00000000-0000-4000-8000-000000000008}
      AUTH_LOGIN_PEPPER: ${AUTH_LOGIN_PEPPER:-}
      ADMIN_LOGIN_CHALLENGE_TTL_MINUTES: ${ADMIN_LOGIN_CHALLENGE_TTL_MINUTES:-10}
      ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-8}
      ALLOW_DEV_ADMIN_AUTH: ${ALLOW_DEV_ADMIN_AUTH:-false}
      DEV_ADMIN_TOKEN: ${DEV_ADMIN_TOKEN:-}
      DEV_ADMIN_USER_ID: ${DEV_ADMIN_USER_ID:-00000000-0000-4000-8000-000000000001}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@atelier.localhost}
      DEV_ADMIN_DISPLAY_NAME: ${DEV_ADMIN_DISPLAY_NAME:-Administración Atelier Lumière}
      PILOT_CHECKOUT_ENABLED: ${PILOT_CHECKOUT_ENABLED:-false}
      PILOT_SHIPPING_CENTS: ${PILOT_SHIPPING_CENTS:-0}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-48}
      EMAIL_VERIFICATION_TTL_HOURS: ${EMAIL_VERIFICATION_TTL_HOURS:-24}
      EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:-60}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      TWO_FACTOR_RESET_TTL_MINUTES: ${TWO_FACTOR_RESET_TTL_MINUTES:-30}
      ACCOUNT_RECOVERY_COOLDOWN_SECONDS: ${ACCOUNT_RECOVERY_COOLDOWN_SECONDS:-300}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_VERIFY_ON_START: ${SMTP_VERIFY_ON_START:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_GREETING_TIMEOUT_MS: ${SMTP_GREETING_TIMEOUT_MS:-10000}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-30000}
      TWO_FACTOR_SETUP_TTL_MINUTES: ${TWO_FACTOR_SETUP_TTL_MINUTES:-15}
      TWO_FACTOR_ENCRYPTION_KEY_BASE64: ${TWO_FACTOR_ENCRYPTION_KEY_BASE64:-}
      TWO_FACTOR_RECOVERY_PEPPER: ${TWO_FACTOR_RECOVERY_PEPPER:-}
      PROVIDER_LOGIN_CHALLENGE_TTL_MINUTES: ${PROVIDER_LOGIN_CHALLENGE_TTL_MINUTES:-10}
      PROVIDER_SESSION_TTL_HOURS: ${PROVIDER_SESSION_TTL_HOURS:-12}
      STORAGE_PATH: /data/media
      MEDIA_UPLOAD_TTL_MINUTES: ${MEDIA_UPLOAD_TTL_MINUTES:-15}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - media_data:/data/media
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atelier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atelier_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-atelier_lumiere}
    volumes:
      - database_data:/var/lib/postgresql/data
      - ../../packages/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atelier} -d ${POSTGRES_DB:-atelier_lumiere}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  database_data:
  media_data:
