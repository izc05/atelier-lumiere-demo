<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Vista previa de entrada · Atelier Lumière</title>
  <link rel="stylesheet" href="entry.css?v=1">
<link rel="icon" type="image/svg+xml" href="/atelier-lumiere-demo/assets/brand/favicon.svg"/><meta name="theme-color" content="#5A0F1F"/><link rel="stylesheet" href="/atelier-lumiere-demo/assets/brand/brand.css?v=1"/></head>
<body>
  <iframe
    id="site-preview"
    title="Portada original de Atelier Lumière"
    src="../?preview=entry-v1"
  ></iframe>

  <section class="entry" id="entry" aria-labelledby="entry-title">
    <div class="entry-panel entry-panel-left" aria-hidden="true"></div>
    <div class="entry-panel entry-panel-right" aria-hidden="true"></div>
    <div class="entry-shade" aria-hidden="true"></div>
    <div class="entry-seam" aria-hidden="true"></div>

    <div class="entry-content">
      <p class="entry-kicker">El hilo de la celebración</p>
      <h1 id="entry-title">Atelier Lumière</h1>
      <p class="entry-subtitle">Piezas hechas despacio para instantes que merecen ser recordados.</p>
      <button class="entry-button" id="enter-button" type="button">
        <span>Entrar al taller</span>
        <span aria-hidden="true">→</span>
      </button>
      <button class="skip-button" id="skip-button" type="button">Saltar introducción</button>
    </div>

    <p class="entry-hint">Toca para descubrir</p>
  </section>

  <button class="replay-button" id="replay-button" type="button" hidden>Repetir entrada</button>
  <script src="entry.js?v=1"></script>
<script src="/atelier-lumiere-demo/assets/brand/brand.js?v=1" defer></script></body>
</html>
